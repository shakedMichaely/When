<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>When - מעקב טיסות לאיסוף</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-100">
        <div class="text-center mb-8">
            <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600 text-2xl">
                <i class="fa-solid fa-plane-arrival"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">מתי לצאת לאסוף?</h1>
            <p class="text-gray-500 mt-2">הזן מספר טיסה כדי לבדוק מתי הטיסה נוחתת</p>
        </div>

        <form id="flightForm" class="space-y-4">
            <div>
                <label for="flightNumber" class="block text-sm font-medium text-gray-700 mb-1">מספר טיסה (לדוגמה: LY1)</label>
                <input type="text" id="flightNumber" name="flightNumber" placeholder="LY1" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-left" dir="ltr">
            </div>
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                <span>בדוק טיסה</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </form>

        <!-- Loading State -->
        <div id="loading" class="hidden mt-8 text-center text-gray-500">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-blue-500"></i>
            <p>מחפש נתוני טיסה...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden mt-6 bg-red-50 text-red-600 p-4 rounded-lg text-sm border border-red-100 flex items-start gap-2">
            <i class="fa-solid fa-circle-exclamation mt-1"></i>
            <span id="errorText">שגיאה בטעינת הנתונים.</span>
        </div>

        <!-- Results -->
        <div id="results" class="hidden mt-8">
            <h2 class="text-lg font-bold text-gray-800 mb-4 text-center">פרטי הטיסה</h2>
            
            <!-- Route Visual -->
            <div class="flex items-center justify-between bg-blue-50 p-4 rounded-xl mb-4 border border-blue-100">
                <div class="text-center w-1/3">
                    <div id="resOriginIata" class="text-2xl font-bold text-blue-700 font-mono">--</div>
                    <div id="resOrigin" class="text-xs text-gray-500 mt-1 truncate" dir="ltr">--</div>
                </div>
                <div class="flex flex-col items-center justify-center w-1/3 px-2">
                    <span id="resDuration" class="text-xs text-gray-500 font-semibold mb-1">--</span>
                    <div class="w-full h-px bg-blue-300 relative">
                        <i class="fa-solid fa-plane text-blue-600 absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2 rotate-180 bg-blue-50 px-2"></i>
                    </div>
                </div>
                <div class="text-center w-1/3">
                    <div id="resDestIata" class="text-2xl font-bold text-blue-700 font-mono">--</div>
                    <div id="resDest" class="text-xs text-gray-500 mt-1 truncate" dir="ltr">--</div>
                </div>
            </div>

            <div class="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-sm">סטטוס טיסה</span>
                    <span id="resStatus" class="font-semibold px-2 py-1 bg-green-100 text-green-700 rounded-md text-xs">--</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-sm">האם היה עיכוב?</span>
                    <span id="resDelay" class="font-semibold text-orange-600 text-xs">--</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-sm">האם המריאה?</span>
                    <span id="resDidTakeoff" class="font-semibold text-gray-800">--</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-sm">זמן המראה</span>
                    <span id="resDeparture" class="font-semibold text-gray-800" dir="ltr">--</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-sm">זמן נחיתה משוער</span>
                    <span id="resEta" class="font-bold text-blue-600" dir="ltr">--</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-sm">חברת תעופה</span>
                    <span id="resAirline" class="font-semibold text-gray-800">--</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500 text-sm">טרמינל / שער</span>
                    <span id="resGate" class="font-semibold text-gray-800">--</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
